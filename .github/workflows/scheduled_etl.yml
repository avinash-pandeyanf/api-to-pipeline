name: Scheduled Open-Meteo ETL

# Runs every 6 hours and can be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Trailing UTC days to process (1 = today only)"
        required: false
        default: "1"
        type: string
      cities:
        description: "Comma-separated city slugs"
        required: false
        default: "london,tokyo,new_york"
        type: string
      commit_data:
        description: "Commit the refreshed Parquet back to this repository"
        required: false
        default: true
        type: boolean

# Required by git-auto-commit-action to push the refreshed data.
permissions:
  contents: write

# Never let two refreshes interleave and race on the same Parquet files.
concurrency:
  group: scheduled-etl-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '1' }}
  CITIES: ${{ github.event.inputs.cities || 'london,tokyo,new_york' }}

jobs:
  # ----------------------------------------------------------------------------------
  # Gate: the pipeline only runs when the test suite is green on supported runtimes.
  # ----------------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources as a syntax check
        run: python -m compileall -q src tests

      - name: Run the test suite
        run: python -m pytest -q

  # ----------------------------------------------------------------------------------
  # Extract -> transform -> load -> analytics, then publish the result.
  # ----------------------------------------------------------------------------------
  etl:
    name: Run ETL and publish data
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history keeps the auto-commit action's rebase/push simple.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the ETL pipeline
        run: |
          mkdir -p data/_reports
          python -m src.main \
            --backfill "$BACKFILL_DAYS" \
            --cities "$CITIES" \
            --data-dir data \
            --report-json "data/_reports/run-${{ github.run_id }}.json"

      - name: Show what was produced
        run: |
          echo "### Parquet lake" >> "$GITHUB_STEP_SUMMARY"
          find data -name '*.parquet' | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total bytes: $(du -sb data | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # Keeps the outputs available even when the commit step is disabled.
      - name: Upload the Parquet lake as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: parquet-lake-${{ github.run_id }}
          path: |
            data/hourly/**/*.parquet
            data/analytics/*.parquet
          if-no-files-found: error
          retention-days: 14

      - name: Commit and push refreshed Parquet
        if: ${{ github.event.inputs.commit_data != 'false' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh Open-Meteo Parquet lake [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: "data/hourly/**/*.parquet data/analytics/*.parquet"
          commit_options: "--no-verify"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
