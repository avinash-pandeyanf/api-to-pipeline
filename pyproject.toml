[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmeteo-parquet-etl"
version = "1.0.0"
description = "Lightweight API-to-Parquet ETL for Open-Meteo hourly weather data, analysed with DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Platform Team" }]
keywords = ["etl", "parquet", "duckdb", "open-meteo", "weather", "github-actions"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Pins are the exact versions the test suite was verified against.
dependencies = [
  "duckdb==1.5.6",
  "polars==2.0.0",
  "pyarrow==26.0.0",
  "requests==2.34.2",
  # DuckDB needs pytz to convert TIMESTAMPTZ values into Python datetimes.
  "pytz==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "responses==0.26.3",
]

[project.scripts]
weather-etl = "src.main:main"

[project.urls]
Homepage = "https://github.com/example/openmeteo-parquet-etl"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Make the flat "src" package importable from the repository root.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: tests that touch the filesystem or DuckDB"]

[tool.coverage.run]
source = ["src"]
branch = true
